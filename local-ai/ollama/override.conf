# Ollama tuning for DGX Spark (GB10). Install as a systemd drop-in:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp override.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama

[Service]
# Loopback only. cloudflared is the sole thing that may reach it, so a broken tunnel
# fails closed instead of publishing an open LLM to the network.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# THE important one. Ollama evicts a model from memory after 5 minutes idle by default.
# NongRak's traffic is sporadic — a parent asks something at 2am, then nothing until
# morning. With the default, that morning question pays a full reload from NVMe and the
# app feels broken exactly when someone finally uses it. 128GB means there is no reason
# to ever evict.
Environment="OLLAMA_KEEP_ALIVE=-1"

# Several specialist models resident at once, rather than one large one. This is what
# the unified memory is actually for.
Environment="OLLAMA_MAX_LOADED_MODELS=4"

# Concurrent requests per model. Modest on purpose: decode here is memory-bandwidth
# bound, so parallel requests divide the same ~273 GB/s rather than adding throughput.
# Raise only if you measure queueing, not on principle.
Environment="OLLAMA_NUM_PARALLEL=4"

# Models on the 4TB NVMe, not the OS partition.
Environment="OLLAMA_MODELS=/opt/models"
